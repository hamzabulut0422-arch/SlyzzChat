<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Appli de Message Réelle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .screen { display: none; width: 100%; max-width: 450px; height: 100vh; background: white; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .active { display: flex; }
        .centered-screen { justify-content: center; align-items: center; padding: 20px; text-align: center; }
        input[type="text"] { width: 80%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { padding: 12px 24px; background: #0084ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0066cc; }
        header { background: #0084ff; color: white; padding: 15px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .plus-btn { background: white; color: #0084ff; border-radius: 50%; width: 35px; height: 35px; font-size: 24px; line-height: 35px; text-align: center; cursor: pointer; font-weight: bold; }
        .contact-list { flex: 1; overflow-y: auto; list-style: none; }
        .contact-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 18px; display: flex; justify-content: space-between; }
        .contact-item:hover { background: #f9f9f9; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background: #efeae2; }
        .message { max-width: 75%; padding: 10px 14px; margin: 5px 0; border-radius: 10px; font-size: 16px; word-wrap: break-word; }
        .msg-me { background: #d9fdd3; align-self: flex-end; }
        .msg-them { background: white; align-self: flex-start; }
        .chat-input-bar { display: flex; padding: 10px; background: #f0f2f5; border-top: 1px solid #ddd; }
        .chat-input-bar input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; }
        .chat-input-bar button { margin-left: 10px; padding: 10px 20px; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- 1. ÉCRAN CHOIX DU PSEUDO -->
    <div id="screen-pseudo" class="screen centered-screen active">
        <h2>Choisis ton pseudo</h2>
        <input type="text" id="my-pseudo-input" placeholder="Ton pseudo...">
        <button onclick="savePseudo()">Entrer</button>
    </div>

    <!-- 2. ÉCRAN D'ACCUEIL (CONTACTS) -->
    <div id="screen-home" class="screen">
        <header>
            <span id="welcome-text">Messages</span>
            <div class="plus-btn" onclick="showAddContact()">+</div>
        </header>
        <ul id="contacts-container" class="contact-list"></ul>
    </div>

    <!-- 3. ÉCRAN D'AJOUT DE CONTACT -->
    <div id="screen-add-contact" class="screen centered-screen">
        <h2>Ajouter un ami</h2>
        <input type="text" id="friend-pseudo-input" placeholder="Pseudo exact de ton ami...">
        <button onclick="addContact()">Ajouter le contact</button>
        <p style="margin-top: 15px; color: gray; cursor: pointer;" onclick="changeScreen('screen-home')">Annuler</p>
    </div>

    <!-- 4. ÉCRAN DE CHAT -->
    <div id="screen-chat" class="screen">
        <header>
            <span style="cursor: pointer; margin-right: 15px;" onclick="closeChat()">⬅</span>
            <span id="chat-title">Ami</span>
        </header>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-bar">
            <input type="text" id="message-input" placeholder="Écrire un message..." onkeypress="checkEnter(event)">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <!-- CHARGEMENT DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tes configurations Firebase injectées ici directement
        const firebaseConfig = {
            apiKey: "AIzaSyC2sBhcLSJ5gPzChgBRibbMU-WQoZ-JJDs",
            authDomain: "chatsimple-c1052.firebaseapp.com",
            projectId: "chatsimple-c1052",
            storageBucket: "chatsimple-c1052.firebasestorage.app",
            messagingSenderId: "184840494525",
            appId: "1:184840494525:web:37cf3e6490bdc71076c6d4",
            measurementId: "G-T32V15NB96"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let myPseudo = "";
        let activeFriend = "";
        let contacts = [];
        let unsubscribeChat = null;

        window.changeScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        window.savePseudo = function() {
            const input = document.getElementById('my-pseudo-input');
            if (input.value.trim() !== "") {
                myPseudo = input.value.trim().toLowerCase(); 
                document.getElementById('welcome-text').innerText = `Salut, ${input.value.trim()}`;
                
                const saved = localStorage.getItem(`contacts_${myPseudo}`);
                if (saved) {
                    contacts = JSON.parse(saved);
                    updateContactsList();
                }
                changeScreen('screen-home');
            }
        }

        window.showAddContact = function() {
            changeScreen('screen-add-contact');
        }

        window.addContact = function() {
            const input = document.getElementById('friend-pseudo-input');
            const friend = input.value.trim().toLowerCase();
            if (friend !== "" && !contacts.includes(friend) && friend !== myPseudo) {
                contacts.push(friend);
                localStorage.setItem(`contacts_${myPseudo}`, JSON.stringify(contacts));
                input.value = "";
                updateContactsList();
                changeScreen('screen-home');
            }
        }

        function updateContactsList() {
            const container = document.getElementById('contacts-container');
            container.innerHTML = "";
            contacts.forEach(friend => {
                const li = document.createElement('li');
                li.className = "contact-item";
                li.innerHTML = `<span>${friend}</span> <span>❯</span>`;
                li.onclick = () => openChat(friend);
                container.appendChild(li);
            });
        }

        window.openChat = function(friend) {
            activeFriend = friend;
            document.getElementById('chat-title').innerText = friend;
            changeScreen('screen-chat');
            
            const chatId = [myPseudo, activeFriend].sort().join("_");
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = `message ${msg.sender === myPseudo ? 'msg-me' : 'msg-them'}`;
                    div.innerText = msg.text;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.closeChat = function() {
            if (unsubscribeChat) unsubscribeChat(); 
            changeScreen('screen-home');
        }

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text !== "" && activeFriend !== "") {
                const chatId = [myPseudo, activeFriend].sort().join("_");
                input.value = "";
                
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    sender: myPseudo,
                    text: text,
                    timestamp: new Date()
                });
            }
        }

        window.checkEnter = function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
